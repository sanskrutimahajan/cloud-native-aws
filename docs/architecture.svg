<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>cloud-native-aws architecture</title>
  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E73B8"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ED7100"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DD344C"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D3CC9"/></marker>
    <marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C7156A"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <style>
      .t  { font-size: 13px; font-weight: 600; fill: #16191F; text-anchor: middle; }
      .s  { font-size: 11px; fill: #545B64; text-anchor: middle; }
      .g  { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .gl { font-size: 22px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .lbl{ font-size: 11px; fill: #232F3E; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .hdr{ font-size: 13px; font-weight: 700; }
      .tile { filter: url(#sh); }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1400" height="1000" fill="#FFFFFF"/>

  <!-- ===================== CI/CD ===================== -->
  <rect x="330" y="18" width="740" height="118" rx="10" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="350" y="40" class="hdr" fill="#24292F">CI/CD · GitHub Actions</text>
  <text x="1050" y="40" class="s" style="text-anchor:end">triggered on PR merge (now manual: workflow_dispatch)</text>

  <g class="tile"><rect x="406" y="54" width="48" height="48" rx="8" fill="#57606A"/></g><text x="430" y="78" class="g">&lt;/&gt;</text>
  <text x="430" y="118" class="t">Source code</text><text x="430" y="131" class="s">PR merged to main</text>

  <g class="tile"><rect x="566" y="54" width="48" height="48" rx="8" fill="#24292F"/></g><text x="590" y="78" class="g">GHA</text>
  <text x="590" y="118" class="t">GitHub Actions</text><text x="590" y="131" class="s">tests → build</text>

  <g class="tile"><rect x="726" y="54" width="48" height="48" rx="8" fill="#02A8EF"/></g><text x="750" y="78" class="g">AMI</text>
  <text x="750" y="118" class="t">Packer → EC2 AMI</text><text x="750" y="131" class="s">Ubuntu 24.04 + app</text>

  <g class="tile"><rect x="886" y="54" width="48" height="48" rx="8" fill="#ED7100"/></g><text x="910" y="78" class="g">LT</text>
  <text x="910" y="118" class="t">Launch template</text><text x="910" y="131" class="s">new version, new AMI</text>

  <line x1="458" y1="78" x2="560" y2="78" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <line x1="618" y1="78" x2="720" y2="78" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <line x1="778" y1="78" x2="880" y2="78" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a-dark)"/>

  <!-- ===================== Users ===================== -->
  <g transform="translate(78,372)">
    <circle cx="-14" cy="-14" r="9" fill="#545B64"/><path d="M-30,10 a16,14 0 0 1 32,0 z" fill="#545B64"/>
    <circle cx="14" cy="-14" r="9" fill="#545B64"/><path d="M-2,10 a16,14 0 0 1 32,0 z" fill="#545B64"/>
    <circle cx="0" cy="-20" r="10" fill="#232F3E"/><path d="M-18,8 a18,16 0 0 1 36,0 z" fill="#232F3E"/>
  </g>
  <text x="78" y="404" class="t">Users</text>

  <!-- ===================== AWS Cloud ===================== -->
  <rect x="200" y="160" width="1170" height="730" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/>
  <rect x="200" y="160" width="128" height="26" fill="#232F3E"/>
  <text x="212" y="178" class="hdr" fill="#fff">AWS Cloud</text>
  <rect x="328" y="160" width="300" height="26" fill="#7B42BC"/>
  <text x="340" y="178" class="hdr" fill="#fff">Infrastructure as Code · Terraform (infra/aws)</text>

  <!-- Route 53 + ACM (global/edge) -->
  <g class="tile"><rect x="226" y="346" width="48" height="48" rx="8" fill="#8C4FFF"/></g><text x="250" y="370" class="g">R53</text>
  <text x="250" y="410" class="t">Route 53</text><text x="250" y="423" class="s">env.sansmah.me</text>

  <g class="tile"><rect x="226" y="606" width="48" height="48" rx="8" fill="#DD344C"/></g><text x="250" y="630" class="g">ACM</text>
  <text x="250" y="670" class="t">Certificate</text><text x="250" y="683" class="s">Manager · TLS</text>

  <!-- ===================== VPC ===================== -->
  <rect x="330" y="200" width="670" height="500" rx="6" fill="#FBF8FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="344" y="220" class="hdr" fill="#7D3CC9">VPC · 10.0.0.0/16 · 3 Availability Zones</text>

  <!-- Public subnet -->
  <rect x="348" y="232" width="634" height="268" rx="6" fill="#F2F8EE" stroke="#7AA116"/>
  <text x="362" y="251" class="hdr" fill="#3F7A00">Public subnets (×3)</text>

  <g class="tile"><rect x="366" y="346" width="48" height="48" rx="24" fill="#8C4FFF"/></g><text x="390" y="370" class="g">IGW</text>
  <text x="390" y="410" class="t">Internet</text><text x="390" y="424" class="t">Gateway</text>

  <rect x="456" y="290" width="148" height="160" rx="6" fill="none" stroke="#DD344C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="466" y="306" class="s" style="text-anchor:start;fill:#DD344C">Security group · 443</text>
  <g class="tile"><rect x="506" y="336" width="48" height="48" rx="8" fill="#8C4FFF"/></g><text x="530" y="360" class="g">ALB</text>
  <text x="530" y="400" class="t">Application</text><text x="530" y="414" class="t">Load Balancer</text><text x="530" y="430" class="s">HTTPS · TLS 1.3</text>

  <rect x="640" y="262" width="326" height="226" rx="6" fill="none" stroke="#ED7100" stroke-width="1.6" stroke-dasharray="8 4"/>
  <text x="652" y="279" class="s" style="text-anchor:start;fill:#C45A00;font-weight:600">Auto Scaling group · 3–5 instances · instance refresh</text>
  <rect x="658" y="294" width="150" height="180" rx="6" fill="none" stroke="#DD344C" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="668" y="310" class="s" style="text-anchor:start;fill:#DD344C">Security group · 8080</text>
  <g class="tile"><rect x="712" y="340" width="40" height="40" rx="6" fill="#F8A04B"/><rect x="706" y="346" width="40" height="40" rx="6" fill="#F28A1E"/><rect x="700" y="352" width="40" height="40" rx="6" fill="#ED7100"/></g>
  <text x="720" y="372" class="g">EC2</text>
  <text x="733" y="412" class="t">EC2 instances</text><text x="733" y="426" class="s">Packer AMI · FastAPI</text><text x="733" y="439" class="s">CloudWatch Agent</text>

  <g class="tile"><rect x="864" y="346" width="48" height="48" rx="8" fill="#DD344C"/></g><text x="888" y="370" class="g">IAM</text>
  <text x="888" y="410" class="t">IAM role</text><text x="888" y="423" class="s">least privilege</text><text x="888" y="436" class="s">no SSH, no keys</text>

  <!-- Private subnet -->
  <rect x="348" y="516" width="634" height="168" rx="6" fill="#EEF5FB" stroke="#2E73B8"/>
  <text x="362" y="535" class="hdr" fill="#1F5A94">Private subnets (×3)</text>
  <g class="tile"><rect x="446" y="572" width="48" height="48" rx="8" fill="#C925D1"/></g><text x="470" y="596" class="g">RDS</text>
  <text x="470" y="636" class="t">RDS PostgreSQL</text><text x="470" y="650" class="s">KMS-encrypted</text>

  <!-- ===================== Regional services ===================== -->
  <rect x="330" y="718" width="670" height="156" rx="6" fill="#FAFAFA" stroke="#AAB7B8" stroke-dasharray="4 3"/>
  <text x="986" y="737" class="hdr" fill="#545B64" text-anchor="end">Regional AWS services</text>

  <g class="tile"><rect x="406" y="764" width="48" height="48" rx="8" fill="#7AA116"/></g><text x="430" y="788" class="g">S3</text>
  <text x="430" y="828" class="t">S3 bucket</text><text x="430" y="842" class="s">syllabus files · SSE-KMS</text>

  <g class="tile"><rect x="576" y="764" width="48" height="48" rx="8" fill="#DD344C"/></g><text x="600" y="788" class="g">KMS</text>
  <text x="600" y="828" class="t">AWS KMS</text><text x="600" y="842" class="s">4 CMKs · auto-rotation</text>

  <g class="tile"><rect x="746" y="764" width="48" height="48" rx="8" fill="#DD344C"/></g><text x="770" y="788" class="g">SM</text>
  <text x="770" y="828" class="t">Secrets Manager</text><text x="770" y="842" class="s">DB password · API key</text>

  <!-- ===================== Observability ===================== -->
  <rect x="1036" y="200" width="314" height="270" rx="10" fill="#FFF7FB" stroke="#E7157B"/>
  <text x="1052" y="222" class="hdr" fill="#C7156A">Observability</text>
  <g class="tile"><rect x="1058" y="246" width="44" height="44" rx="8" fill="#E7157B"/></g><text x="1080" y="268" class="g">CW</text>
  <text x="1116" y="264" class="t" style="text-anchor:start">Amazon CloudWatch</text><text x="1116" y="279" class="s" style="text-anchor:start">logs + StatsD custom metrics</text>
  <g class="tile"><rect x="1058" y="318" width="44" height="44" rx="8" fill="#E7157B"/></g><text x="1080" y="340" class="g">AL</text>
  <text x="1116" y="336" class="t" style="text-anchor:start">CloudWatch alarms</text><text x="1116" y="351" class="s" style="text-anchor:start">CPU &gt; 5% scale up · &lt; 3% down</text>
  <g class="tile"><rect x="1058" y="390" width="44" height="44" rx="8" fill="#E7157B"/></g><text x="1080" y="412" class="g">LI</text>
  <text x="1116" y="408" class="t" style="text-anchor:start">Logs &amp; metrics insights</text><text x="1116" y="423" class="s" style="text-anchor:start">API, DB and S3 latency</text>
  <line x1="1080" y1="292" x2="1080" y2="314" stroke="#C7156A" stroke-width="1.4" marker-end="url(#a-pink)"/>

  <!-- ===================== Event pipeline ===================== -->
  <rect x="1036" y="500" width="314" height="160" rx="10" fill="#FFFFFF" stroke="#AAB7B8"/>
  <text x="1052" y="522" class="hdr" fill="#545B64">Email verification (serverless)</text>
  <g class="tile"><rect x="1062" y="556" width="48" height="48" rx="8" fill="#E7157B"/></g><text x="1086" y="580" class="g">SNS</text>
  <text x="1086" y="620" class="t">SNS topic</text><text x="1086" y="634" class="s">user sign-up</text>
  <g class="tile"><rect x="1170" y="556" width="48" height="48" rx="8" fill="#ED7100"/></g><text x="1194" y="580" class="gl">λ</text>
  <text x="1194" y="620" class="t">Lambda</text><text x="1194" y="634" class="s">send-email handler</text>
  <g class="tile"><rect x="1278" y="556" width="48" height="48" rx="8" fill="#C925D1"/></g><text x="1302" y="580" class="g">DDB</text>
  <text x="1302" y="620" class="t">DynamoDB</text><text x="1302" y="634" class="s">email dedup</text>
  <line x1="1114" y1="580" x2="1164" y2="580" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <line x1="1222" y1="580" x2="1272" y2="580" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="1139" y="572" class="lbl">triggers</text><text x="1247" y="572" class="lbl">dedup</text>

  <!-- SendGrid (external) -->
  <rect x="1104" y="912" width="180" height="70" rx="8" fill="#F5F9FF" stroke="#1A82E2" stroke-dasharray="5 3"/>
  <g class="tile"><rect x="1118" y="925" width="44" height="44" rx="8" fill="#1A82E2"/></g><text x="1140" y="947" class="g">SG</text>
  <text x="1174" y="943" class="t" style="text-anchor:start">SendGrid</text><text x="1174" y="958" class="s" style="text-anchor:start">external email API</text>
  <path d="M1194,650 L1194,906" fill="none" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="1194" y="760" class="lbl">sends verification email</text>

  <!-- ===================== Request path ===================== -->
  <line x1="112" y1="370" x2="220" y2="370" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a-dark)"/>
  <text x="160" y="362" class="lbl">sansmah.me</text>
  <line x1="278" y1="370" x2="360" y2="370" stroke="#232F3E" stroke-width="1.8" marker-end="url(#a-dark)"/>
  <text x="312" y="362" class="lbl">DNS</text>
  <line x1="418" y1="360" x2="500" y2="360" stroke="#2E73B8" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="459" y="352" class="lbl">HTTPS 443</text>
  <path d="M558,360 L620,360 L620,366 L694,366" fill="none" stroke="#2E73B8" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="630" y="350" class="lbl">HTTP 8080</text>

  <!-- ACM -> ALB -->
  <path d="M276,630 L310,630 L310,468 L530,468 L530,456" fill="none" stroke="#DD344C" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-red)"/>
  <text x="380" y="484" class="lbl" style="fill:#DD344C">TLS certificate</text>

  <!-- CI/CD -> ASG (instance refresh) -->
  <path d="M910,136 L910,256" fill="none" stroke="#ED7100" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#a-orange)"/>
  <text x="918" y="184" class="lbl" style="fill:#C45A00;text-anchor:start">instance refresh</text>

  <!-- EC2 -> RDS -->
  <path d="M712,474 L712,596 L500,596" fill="none" stroke="#7D3CC9" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="620" y="588" class="lbl">SQL queries</text>
  <!-- EC2 -> S3 -->
  <path d="M690,474 L690,709 L430,709 L430,758" fill="none" stroke="#7D3CC9" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="560" y="713" class="lbl">upload / download</text>
  <!-- EC2 -> Secrets Manager -->
  <path d="M770,474 L770,758" fill="none" stroke="#7D3CC9" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="770" y="560" class="lbl">fetch secrets at boot</text>

  <!-- KMS encrypts -->
  <line x1="572" y1="788" x2="460" y2="788" stroke="#DD344C" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a-red)"/>
  <line x1="628" y1="788" x2="740" y2="788" stroke="#DD344C" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a-red)"/>
  <path d="M600,760 L600,620 L500,620" fill="none" stroke="#DD344C" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a-red)"/>
  <text x="516" y="781" class="lbl" style="fill:#DD344C">encrypts</text>
  <text x="684" y="781" class="lbl" style="fill:#DD344C">encrypts</text>
  <text x="560" y="640" class="lbl" style="fill:#DD344C">encrypts</text>

  <!-- EC2 -> SNS -->
  <path d="M808,456 L1018,456 L1018,580 L1056,580" fill="none" stroke="#C7156A" stroke-width="1.6" marker-end="url(#a-pink)"/>
  <text x="900" y="476" class="lbl">publish on user sign-up</text>

  <!-- EC2 -> CloudWatch, alarm -> ASG -->
  <path d="M966,290 L1010,290 L1010,268 L1052,268" fill="none" stroke="#C7156A" stroke-width="1.6" marker-end="url(#a-pink)"/>
  <text x="1010" y="304" class="lbl" style="font-size:10px">logs + metrics</text>
  <path d="M1054,340 L972,340" fill="none" stroke="#ED7100" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>
  <text x="1012" y="356" class="lbl" style="fill:#C45A00;font-size:10px">scale up / down</text>
</svg>
