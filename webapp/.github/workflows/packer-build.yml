name: Packer Build

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-tests:
    name: Run Integration Tests
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webapp_db
          POSTGRES_USER: webapp_user
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
          echo "DATABASE_PORT=5432" >> $GITHUB_ENV
          echo "DATABASE_NAME=webapp_db" >> $GITHUB_ENV
          echo "DATABASE_USER=webapp_user" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> $GITHUB_ENV
          echo "APP_HOST=0.0.0.0" >> $GITHUB_ENV
          echo "APP_PORT=8080" >> $GITHUB_ENV

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U webapp_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        run: pytest -v --tb=short

  build-image:
    name: Build Custom Images
    needs: integration-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application artifact
        run: |
          zip -r webapp.zip app/ scripts/ requirements.txt run.py cloudwatch-config.json -x "*.pyc" "__pycache__/*" "*.pytest_cache/*"
          mv webapp.zip packer/

      - name: Configure AWS credentials (DEV account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Initialize Packer plugins
        working-directory: packer
        run: packer init .

      - name: Build images
        working-directory: packer
        run: packer build -var "app_zip_path=webapp.zip" .

      - name: Extract AMI ID from Packer manifest
        id: get-ami
        working-directory: packer
        run: |
          AMI_ID=$(jq -r '.builds[] | select(.builder_type == "amazon-ebs") | .artifact_id | split(":")[1]' manifest.json)
          echo "AMI_ID=${AMI_ID}" >> $GITHUB_OUTPUT
          echo "Built AMI: ${AMI_ID}"

      - name: Reconfigure AWS credentials (DEMO account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}

      - name: Create new Launch Template version with latest AMI
        run: |
          LT_NAME="${{ secrets.LAUNCH_TEMPLATE_NAME }}"
          AMI_ID="${{ steps.get-ami.outputs.AMI_ID }}"
          aws ec2 create-launch-template-version \
            --launch-template-name "${LT_NAME}" \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"${AMI_ID}\"}"

      - name: Update Auto Scaling Group to use latest Launch Template version
        run: |
          LT_NAME="${{ secrets.LAUNCH_TEMPLATE_NAME }}"
          ASG_NAME="${{ secrets.ASG_NAME }}"
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name "${ASG_NAME}" \
            --launch-template "LaunchTemplateName=${LT_NAME},Version=\$Latest"

      - name: Start instance refresh
        id: start-refresh
        run: |
          ASG_NAME="${{ secrets.ASG_NAME }}"
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG_NAME}" \
            --query 'InstanceRefreshId' \
            --output text)
          echo "REFRESH_ID=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "Instance refresh started: ${REFRESH_ID}"

      - name: Wait for instance refresh to complete
        run: |
          ASG_NAME="${{ secrets.ASG_NAME }}"
          REFRESH_ID="${{ steps.start-refresh.outputs.REFRESH_ID }}"
          echo "Polling instance refresh ${REFRESH_ID}..."

          while true; do
            RESULT=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${ASG_NAME}" \
              --instance-refresh-ids "${REFRESH_ID}")

            STATUS=$(echo "$RESULT" | jq -r '.InstanceRefreshes[0].Status')
            PERCENT=$(echo "$RESULT" | jq -r '.InstanceRefreshes[0].PercentageComplete // 0')

            echo "Status: ${STATUS} | Progress: ${PERCENT}%"

            case "$STATUS" in
              Successful)
                echo "Instance refresh completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "Instance refresh ended with status: ${STATUS}"
                exit 1
                ;;
            esac

            sleep 30
          done
