name: Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-ci.yml'

defaults:
  run:
    working-directory: webapp

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
  
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webapp_db
          POSTGRES_USER: webapp_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
          echo "DATABASE_PORT=5432" >> $GITHUB_ENV
          echo "DATABASE_NAME=webapp_db" >> $GITHUB_ENV
          echo "DATABASE_USER=webapp_user" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=ci_test_password" >> $GITHUB_ENV
          echo "APP_HOST=0.0.0.0" >> $GITHUB_ENV
          echo "APP_PORT=8080" >> $GITHUB_ENV

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U webapp_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests
        run: |
          pytest -v --tb=short

      - name: Generate coverage report
        if: success()
        run: |
          pytest --cov=app --cov-report=term-missing