name: Packer Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'webapp/**'
      - '.github/workflows/webapp-packer-validate.yml'

defaults:
  run:
    working-directory: webapp

jobs:
  validate:
    name: Validate Packer Templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      - name: Initialize Packer plugins
        working-directory: webapp/packer
        run: packer init .

      - name: Create dummy artifact for validation
        run: touch packer/webapp.zip

      - name: Check Packer formatting
        working-directory: webapp/packer
        run: |
          if ! packer fmt -check -diff .; then
            echo "::error::Packer template is not properly formatted. Run 'packer fmt .' to fix."
            exit 1
          fi

      - name: Validate Packer template
        working-directory: webapp/packer
        run: packer validate -var "app_zip_path=webapp.zip" .
